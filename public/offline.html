<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>אין חיבור · שוגי ישראל</title>
  <style>
    :root { --washi: #ECE4D4; --ink: #1C1B19; --muted: #675D50; --seal: #B8361F; }
    @media (prefers-color-scheme: dark) { :root { --washi: #221A14; --ink: #EFE7D7; --muted: #BBAA92; --seal: #DE6A4F; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--washi); color: var(--ink);
      font: 18px/1.6 'Heebo', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 26px; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: var(--ink); color: var(--washi); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icon-192.png" alt="" />
    <h1>אין חיבור לאינטרנט</h1>
    <p>העמוד הזה עוד לא נשמר במכשיר. כשהחיבור יחזור, הוא ייפתח כרגיל.</p>
    <a href="/app/">לנסות שוב</a>
  </main>
</body>
</html>
